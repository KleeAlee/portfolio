  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #2b2727;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      overflow-y: auto; /* Enables smooth scrolling down for 25+ tiles */
    }

    /* 3 Columns Grid with 50vh height per row (First screen = exactly 2 rows = 6 tiles) */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: 50vh;
      grid-auto-rows: 50dvh;
      width: 100vw;
      gap: 0;
    }

    .tile {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: block;
      text-decoration: none;
      background-color: #2b2727;
    }

    /* Reveal animation */
    .photo-tile {
      opacity: 0;
      transform: scale(0.97);
      transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1), 
                  transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .photo-tile.is-revealed {
      opacity: 1;
      transform: scale(1);
    }

    /* Image layer */
    .tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }

    /* Dimmed overlay */
    .tile-overlay {
      position: absolute;
      inset: 0;
      background-color: rgba(43, 39, 39, 0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 2;
      padding: 24px;
    }

    /* Title text */
    .tile-title {
      color: #ffffff;
      font-size: 1.25rem;
      font-weight: 500;
      letter-spacing: 0;
      text-align: center;
      transition: transform 0.4s ease;
      transform: translateY(6px);
      user-select: none;
    }

    /* Hover interactions */
    .photo-tile.is-revealed:hover img {
      transform: scale(1.03);
    }

    .photo-tile.is-revealed:hover .tile-overlay {
      opacity: 1;
    }

    .photo-tile.is-revealed:hover .tile-title {
      transform: translateY(0);
    }

    /* Top-Left Logo Tile */
    .logo-tile {
      background-color: #2b2727;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 3;
    }

    .logo-tile img {
      max-width: 240px;
      width: 70%;
      height: auto;
      object-fit: contain;
      transition: opacity 0.3s ease;
    }

    .logo-tile:hover img {
      opacity: 0.75;
      transform: none;
    }

    /* Responsive adjustments */
 @media (max-width: 768px) {
  html, body {
    overflow-y: auto;
  }

  .gallery-grid {
    grid-template-columns: 1fr;
    grid-template-rows: auto;
    height: auto;
  }

  .tile {
    height: 50vh;
    min-height: 280px;
  }

  .tile-overlay {
    opacity: 1;
    background-color: rgba(43, 39, 39, 0.65);
  }

  .tile-title {
    transform: translateY(0);
    font-size: 1.05rem;
  }

  .logo-tile {
    order: -1;
    height: 35vh;
    min-height: 200px;
  }

  .logo-tile img {
    max-width: 200px;
  }
}

  <!-- 1. Load the titles file -->
  <script src="titles-design.js"></script>

  <!-- 2. Populate titles and run animations -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      // Populate titles from titles-design.js
      if (typeof DESIGN_TITLES !== 'undefined') {
        document.querySelectorAll('[data-title-key]').forEach(el => {
          const key = el.getAttribute('data-title-key');
          if (DESIGN_TITLES[key]) {
            el.textContent = DESIGN_TITLES[key];
          }
        });
      }

      const photoTiles = Array.from(document.querySelectorAll('.photo-tile'));

      // First screen: the first 5 tiles visible on load
      const initialTiles = photoTiles.slice(0, 5);
      const remainingTiles = photoTiles.slice(5);

      // Randomize entrance order for the first screen tiles
      for (let i = initialTiles.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [initialTiles[i], initialTiles[j]] = [initialTiles[j], initialTiles[i]];
      }

      initialTiles.forEach((tile, index) => {
        setTimeout(() => {
          tile.classList.add('is-revealed');
        }, 500 + (index * 450));
      });

      // Smoothly reveal remaining tiles as you scroll down
      const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-revealed');
            obs.unobserve(entry.target);
          }
        });
      }, {
        threshold: 0.15,
        rootMargin: '0px 0px -50px 0px'
      });

      remainingTiles.forEach(tile => observer.observe(tile));
    });
  </script>
